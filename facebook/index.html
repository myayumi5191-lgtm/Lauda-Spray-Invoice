<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lauda Spray">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Lauda Spray Facebook</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}.wrap{width:min(100%,420px);text-align:center}.logo{width:112px;height:112px;object-fit:contain;border-radius:24px;margin:0 auto 24px;display:block}.eyebrow{color:#f58220;letter-spacing:2px;font-size:13px;font-weight:700}.title{font-size:30px;margin:10px 0 8px}.sub{color:#bdbdbd;font-size:16px;line-height:1.6;margin:0 0 30px}.open{display:block;width:100%;padding:18px 20px;border-radius:14px;background:#f58220;color:#111;text-decoration:none;font-size:18px;font-weight:800}.hint{font-size:13px;color:#888;line-height:1.6;margin-top:20px}
</style>
</head>
<body>
<main class="wrap">
<img class="logo" src="./icons/icon-192.png" alt="Lauda Spray logo">
<div class="eyebrow">LAUDA SPRAY</div>
<h1 class="title">Facebook 公众主页</h1>
<p class="sub">点击下面按钮，进入 Lauda Spray Facebook 主页。</p>
<a class="open" href="https://www.facebook.com/LaudaSpray" target="_blank" rel="noopener">打开 Lauda Spray Facebook</a>
<p class="hint">如果手机已安装 Facebook，iPhone 可能会直接交由 Facebook App 打开；否则会在浏览器中打开。</p>
</main>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</body>
</html>
